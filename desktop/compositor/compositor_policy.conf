# Aether sway session config
font pango:Noto Sans 11

# We render our own panels; sway's bar stays off.
bar {
    mode invisible
}

output * bg /usr/share/aether/desktop/assets/wallpapers/aether-warm.svg fill

floating_modifier $mod
default_border pixel 2
default_floating_border normal
hide_edge_borders smart
gaps inner 0
gaps outer 0

set $mod Mod4
bindsym $mod+Return exec aether-terminal
bindsym $mod+d exec aetherctl launcher
bindsym $mod+q kill
bindsym $mod+Shift+e exec aetherctl toast 'Exit session requested — use the top bar menu'
bindsym $mod+l exec aether-lockscreen
bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down
bindsym $mod+1 workspace 1
bindsym $mod+2 workspace 2
bindsym $mod+3 workspace 3
bindsym $mod+4 workspace 4
bindsym $mod+5 workspace 5
bindsym $mod+6 workspace 6
bindsym $mod+7 workspace 7
bindsym $mod+8 workspace 8
bindsym $mod+9 workspace 9
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Right move right
bindsym $mod+space floating toggle

input type:keyboard {
    xkb_layout us
}
input type:touchpad {
    tap enabled
    natural_scroll enabled
}

# The native shell draws top bar/taskbar/Miso/panels:
exec /usr/bin/aether-shell
