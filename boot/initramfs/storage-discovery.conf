# storage-discovery.conf — reliable root-device discovery defaults.
# Sourced by /init; each value may be overridden on the kernel cmdline.
DISCOVERY_TIMEOUT=5          # seconds to wait for /dev/disk/by-* to settle
DISCOVERY_DEVICES="by-label by-uuid by-partlabel"  # stable-path preference
ROOT_LABEL="AETHEROS"        # installed system label
LIVE_LABEL="AETHER_LIVE"     # live/install media label
KNOWN_GOOD_LABEL="AETHEROS"  # rollback slot label (see recovery/rollback)
