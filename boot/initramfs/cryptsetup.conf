# cryptsetup.conf — unlocking policy for the encrypted Aether root.
# The volume is opened as aether-root (matches /etc/crypttab and the mapper
# name used by installer/storage/encryption_setup.py).
MAPPER_NAME="aether-root"
KEYFILE_TIMEOUT=0            # no keyfile: passphrase via console (2 tries)
ALLOW_DISCARD="no"           # SSD discards disabled until /etc/crypttab opts
LUKS_TYPE="luks2"
