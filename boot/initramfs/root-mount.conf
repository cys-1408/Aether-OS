# root-mount.conf — identification + mount behavior for the real root.
root=LABEL=AETHEROS          # fallback when cmdline omits root=
NEWROOT_OPTS="rw,relatime"   # mount options for the real root
NEWROOT_INIT="/sbin/init"    # real init binary (systemd on AetherOS)
ROOT_FSTYPES="ext4 btrfs"    # filesystem modules to check, in order
