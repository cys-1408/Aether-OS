# systemd drop-in for aether-intentfs
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=tmpfs
BindPaths=%h  # per-user home bind handled by the template unit
ReadWritePaths=/run/aether
PrivateTmp=yes
RestrictAddressFamilies=AF_UNIX
SystemCallFilter=@system-service
CapabilityBoundingSet=
